[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pii-redact"
dynamic = ["version"]
description = "Lokaler Desktop-Client zum Erkennen und Schwärzen personenbezogener Daten in PDF-, TXT- und Markdown-Dokumenten (Presidio, Deutsch)."
readme = "README.md"
license = {text = "AGPL-3.0-or-later"}
classifiers = ["License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)"]
requires-python = ">=3.12"
dependencies = [
    "presidio-analyzer>=2.2.360",
    "spacy>=3.7,<4",
    # Obergrenzen: neue Haupt-/Unterversionen erst nach eigenem Test übernehmen (gebaut wird mit der Lock-Datei,
    # setup.bat installiert aber nach diesen Bereichen) – siehe CLAUDE.md „Abhängigkeiten“
    "pymupdf>=1.24.3,<2",      # 2.0: Hauptversion, bringt pymupdf-layout/pymupdf4llm u. a. mit
    "PySide6>=6.6,<6.12",      # 6.12: zieht zusätzlich WebEngine und Pdf-Module (> 130 MB) mit
    # Modus „Gründlich“: Transformer als ONNX – bewusst OHNE PyTorch
    "onnxruntime>=1.17",
    "tokenizers>=0.15",
    "huggingface-hub<2",       # über tokenizers; ab tokenizers 0.23.3 wäre die Hauptversion 2 erlaubt
    "numpy",
    # Texterkennung (OCR) als Rückfallebene für gescannte Seiten – ebenfalls über onnxruntime
    "rapidocr>=3.9,<3.10",     # 3.10: wechselt auf opencv-python-headless (dort greift die Grenze < 5 nicht)
    "opencv-python>=4.8,<5",
    # Sicherheits-Untergrenzen für indirekte Abhängigkeiten (gebaut wird mit packaging/requirements-lock.txt):
    "pillow>=13.0.0",          # über rapidocr; 8 Lücken in 12.x (Okt. 2026)
    "certifi>=2026.10.19",     # über requests/httpx; kompromittierte Zertifizierungsstelle (emSign)
    "filelock>=4.2.1",         # über huggingface-hub/tldextract; 3 Lücken in den Sperrdateien (Okt. 2026)
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
pii-redact-cli = "pii_redact.cli:main"

[project.gui-scripts]
pii-redact = "pii_redact.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "pii_redact.__version__"}

[tool.setuptools.package-data]
pii_redact = ["resources/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

# Stilprüfung (in der CI: `ruff check src tests tools samples`). Bewusst nur Regeln, die sich ohne Umbau einhalten
# lassen; Komplexitätsregeln (C90, PLR) und Typprüfung gehören zu einem eigenen Refactoring.
[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = [
    "F",    # Pyflakes: unbenutzte Namen, Tippfehler in Namen
    "E",    # pycodestyle
    "W",
    "I",    # Reihenfolge der Importe
    "B",    # fehleranfällige Muster (bugbear)
    "UP",   # veraltete Schreibweisen
    "SIM",  # Vereinfachungen
    "C90",  # Verzweigungen je Funktion (McCabe), Grenze unten
]

[tool.ruff.lint.mccabe]
# Höchstens 12 Verzweigungspfade je Funktion. Wer darüber kommt, zerlegt die Funktion; eine Ausnahme
# (`# noqa: C901` mit Begründung) nur dort, wo das Zerlegen den Code schlechter lesbar machte.
max-complexity = 12

[tool.ruff.lint.per-file-ignores]
# Offline-Schalter müssen vor den Importen gesetzt sein, die Hugging-Face-Bibliotheken laden
"src/pii_redact/cli.py" = ["E402"]
# Hilfsskripte, die nicht zum ausgelieferten Programm gehören: Der Modellvergleich braucht Hugging Face und lässt
# sich in der CI nicht testen, die ETW-Prüfung nur unter Windows als Administrator – ein Umbau wäre ungeprüft.
"tools/benchmark_models.py" = ["C901"]
"tools/etw_pruefen.py" = ["C901"]

[tool.ruff.lint.flake8-bugbear]
# Qt-Schreibweise für Modellklassen: `parent=QModelIndex()` – der Wert ist unveränderlich
extend-immutable-calls = ["PySide6.QtCore.QModelIndex"]
