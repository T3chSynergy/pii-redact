[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pii-redact"
dynamic = ["version"]
description = "Lokaler Desktop-Client zum Erkennen und Schwärzen personenbezogener Daten in PDF-, TXT- und Markdown-Dokumenten (Presidio, Deutsch)."
readme = "README.md"
license = {text = "AGPL-3.0-or-later"}
classifiers = ["License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)"]
requires-python = ">=3.10"
dependencies = [
    "presidio-analyzer>=2.2.360",
    "spacy>=3.7,<4",
    "pymupdf>=1.24.3",
    "PySide6>=6.6",
    # Modus „Gründlich“: Transformer als ONNX – bewusst OHNE PyTorch
    "onnxruntime>=1.17",
    "tokenizers>=0.15",
    "numpy",
    # Texterkennung (OCR) als Rückfallebene für gescannte Seiten – ebenfalls über onnxruntime
    "rapidocr>=3.9,<4",
    "opencv-python>=4.8,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
pii-redact-cli = "pii_redact.cli:main"

[project.gui-scripts]
pii-redact = "pii_redact.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "pii_redact.__version__"}

[tool.setuptools.package-data]
pii_redact = ["resources/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
