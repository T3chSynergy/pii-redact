# Automatische Prüfung bei jedem Pull Request und jedem Push auf dev/main.
# Tests laufen auf Windows (Zielplattform) mit den festen Paketversionen aus der Lock-Datei.
name: Tests

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

# Ältere Läufe desselben PRs/Branches abbrechen, wenn neue Commits kommen
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (Windows, Python 3.14)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: packaging/requirements-lock.txt

      - name: Pakete installieren (Lock-Datei)
        run: |
          python -m pip install --upgrade pip
          pip install -r packaging/requirements-lock.txt
          # ruff und mypy: Regeln und Meldungen ändern sich zwischen Unterversionen – bewusst anheben
          pip install pytest "ruff>=0.17,<0.18" "mypy>=2.4,<2.5"
          pip install --no-deps -e .

      # Transformer-Modell für den Modus „Gründlich“ vom neuesten Release, das es enthält – zwischengespeichert,
      # Schlüssel ist die Prüfsummendatei. Fehlt es, werden die „Gründlich“-Tests übersprungen.
      - name: Transformer-Modell aus dem Cache
        id: model-cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25  # v5.1.0
        with:
          path: models/ner/davlan-xlmr-ner
          key: model-${{ hashFiles('packaging/modell.sha256') }}

      - name: Transformer-Modell vom Release laden
        if: steps.model-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          try {
            $tag = gh api "repos/${{ github.repository }}/releases" --jq '[.[] | select(any(.assets[]; .name == "davlan-xlmr-ner.zip"))][0].tag_name'
            if (-not $tag) { throw "Kein Release mit davlan-xlmr-ner.zip gefunden." }
            gh release download $tag --repo "${{ github.repository }}" --pattern davlan-xlmr-ner.zip --dir "$env:RUNNER_TEMP"
            Expand-Archive "$env:RUNNER_TEMP\davlan-xlmr-ner.zip" -DestinationPath models\ner\
            Get-Content packaging\modell.sha256 | Where-Object { $_ -and -not $_.StartsWith("#") } | ForEach-Object {
              $hash, $name = $_ -split '\s+', 2
              $actual = (Get-FileHash "models\ner\davlan-xlmr-ner\$name" -Algorithm SHA256).Hash.ToLower()
              if ($actual -ne $hash) { throw "Prüfsumme falsch: $name" }
            }
            Write-Host "Modell geladen und geprüft."
          } catch {
            # nichts Halbes im Cache ablegen – die „Gründlich“-Tests werden dann übersprungen
            Remove-Item -Recurse -Force models\ner\davlan-xlmr-ner -ErrorAction SilentlyContinue
            throw
          }

      - name: Lint (ruff)
        run: ruff check src tests tools samples   # Regeln: [tool.ruff] in pyproject.toml

      - name: Typprüfung (mypy)
        run: mypy   # nur der Kern; Einstellungen: [tool.mypy] in pyproject.toml

      - name: Tests (pytest)
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q -rs

  audit:
    name: Sicherheitslücken (pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.14"
      - name: pip-audit gegen die Lock-Datei
        run: |
          pip install pip-audit
          grep -v " @ " packaging/requirements-lock.txt > lock-ohne-modell.txt
          pip-audit -r lock-ohne-modell.txt --no-deps --disable-pip --progress-spinner off
